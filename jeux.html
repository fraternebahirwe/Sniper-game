<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Sniper Arena</title>
    <!-- Liaison avec le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="game-title">🎯 Sniper Arena</h1>
    <p class="instructions">Éliminez un maximum de cibles mouvantes !</p>
    
    <!-- Score interactif du haut -->
    <div class="score-display">Score :</div>

    <!-- Barre de temps -->
    <div class="timer-container">
        <div class="timer-bar"></div>
    </div>

    <!-- Zone d'action -->
    <div class="game-area">
        
        <!-- Écran Game Over -->
        <div class="game-over-screen">
            <h2>Temps Écoulé !</h2>
            <p>Fin de la session de tir.</p>
            <div class="final-score-box">Score Final :</div>
            <button onclick="location.reload()">🔄 Recommencer</button>
        </div>

        <!-- Les Checkboxes (Cibles réactives) -->
        <input type="checkbox" class="target-1">
        <input type="checkbox" class="target-2">
        <input type="checkbox" class="target-3">
        <input type="checkbox" class="target-4">
    </div>

    <!-- Bouton Reset sous l'arène -->
    <div class="restart-container">
        <button onclick="location.reload()">Forcer le Reset</button>
    </div>

</body>
</html>
