<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GAME TARGET</title>
    <style>
        /* 1. Configuration globale et compteur de score */
        body {
            counter-reset: score; /* Initialise le score global */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        #game-title {
            color: #3498db;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .instructions {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* 2. Affichage du score */
        .score-display {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .score-display::after {
            content: " " counter(score); /* Affiche dynamiquement le score */
            font-weight: bold;
            color: #2ecc71;
        }

        /* 3. La zone de jeu */
        .game-area {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 20px auto;
            border: 4px solid #3498db;
            border-radius: 8px;
            background: #111;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* 4. Les cibles (Checkboxes stylisées en cibles) */
        input[type="checkbox"] {
            position: absolute;
            appearance: none;
            -webkit-appearance: none;
            width: 40px;
            height: 40px;
            background-color: #e74c3c;
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: crosshair;
            z-index: 2;
            outline: none;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        /* Design de "viseur" au centre de chaque rond */
        input[type="checkbox"]::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Effet au survol */
        input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        /* Incrémente le score et fait disparaître proprement la cible */
        input[type="checkbox"]:checked {
            counter-increment: score;
            opacity: 0;
            pointer-events: none; /* Empêche de recliquer dessus */
        }

        /* 5. Mouvements et designs uniques pour chaque cible */
        
        /* Cible 1 : Rouge, rapide */
        .target-1 {
            background-color: #e74c3c;
            animation: move1 4s infinite linear alternate;
        }

        /* Cible 2 : Bleue, moyenne */
        .target-2 {
            background-color: #3498db;
            animation: move2 5s infinite linear alternate;
        }

        /* Cible 3 : Verte, lente */
        .target-3 {
            background-color: #2ecc71;
            animation: move3 6s infinite linear alternate;
        }

        /* Cible 4 : Jaune, très rapide */
        .target-4 {
            background-color: #f1c40f;
            animation: move4 3.5s infinite linear alternate;
        }

        /* Animations personnalisées pour éviter les collisions rectilignes */
        @keyframes move1 {
            0%   { top: 10%; left: 10%; }
            50%  { top: 80%; left: 30%; }
            100% { top: 30%; left: 80%; }
        }

        @keyframes move2 {
            0%   { top: 80%; left: 80%; }
            50%  { top: 20%; left: 50%; }
            100% { top: 70%; left: 10%; }
        }

        @keyframes move3 {
            0%   { top: 50%; left: 10%; }
            50%  { top: 10%; left: 70%; }
            100% { top: 80%; left: 50%; }
        }

        @keyframes move4 {
            0%   { top: 20%; left: 70%; }
            50%  { top: 70%; left: 80%; }
            100% { top: 10%; left: 20%; }
        }

        /* 6. Bouton Recommencer */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1 id="game-title">Mini-Game Sniper</h1>
    <p class="instructions">Cliquez sur les cibles mouvantes avant qu'elles ne s'échappent !</p>
    
    <div class="score-display">Your Score :</div>

    <div class="game-area">
        <!-- Chaque checkbox est une cible autonome -->
        <input type="checkbox" class="target-1">
        <input type="checkbox" class="target-2">
        <input type="checkbox" class="target-3">
        <input type="checkbox" class="target-4">
    </div>

    <p><button onclick="location.reload()">Restart Game</button></p>

</body>
</html>
